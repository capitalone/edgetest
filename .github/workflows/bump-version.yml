# This workflow manually bumps the package version and opens a PR with the change.
# edgetest uses CalVer (YYYY.MM.INC0) via `bumpver`, configured in pyproject.toml:
#   - "bump" (default) rolls the date forward, e.g. 2026.5.1 -> 2026.9.0
#   - "patch" keeps the date and increments the counter, e.g. 2026.5.1 -> 2026.5.2
#   - custom_version sets an exact version (must match the YYYY.MM.INC0 pattern)
# The version lives in three places, all updated by bumpver per [bumpver.file_patterns]:
#   edgetest/__init__.py, pyproject.toml ([bumpver] current_version), docs/source/conf.py
name: "Bump version"

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "How to bump (ignored if custom_version is set)"
        type: choice
        options:
          - bump
          - patch
        default: bump
      custom_version:
        description: "Exact version to set (must match YYYY.MM.INC0). Overrides bump_type."
        type: string
        default: ""

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin@v7.0.1

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # pin@v10.2.0
        with:
          python-version: "3.12"

      - name: Bump version and push branch
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OLD_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' edgetest/__init__.py)
          export OLD_VERSION

          if [[ -n "$CUSTOM_VERSION" ]]; then
            BUMP_ARGS=(--set-version "$CUSTOM_VERSION")
          elif [[ "$BUMP_TYPE" == "patch" ]]; then
            BUMP_ARGS=(--pin-date --patch)
          else
            BUMP_ARGS=()
          fi

          # bumpver ships in the `build` extra; run it against the locked env.
          uv run --locked --extra build bumpver update \
            "${BUMP_ARGS[@]}" \
            --no-fetch --no-commit --no-tag-commit --no-push

          NEW_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' edgetest/__init__.py)

          if [[ "$NEW_VERSION" == "$OLD_VERSION" ]]; then
            echo "No version change (still $OLD_VERSION); nothing to do." >&2
            exit 1
          fi

          BRANCH_NAME="bump-version-${NEW_VERSION}"

          git switch -c "$BRANCH_NAME"
          git add edgetest/__init__.py pyproject.toml docs/source/conf.py
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push -u origin "$BRANCH_NAME"

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # pin@v9.0.0
        env:
          BRANCH_NAME: ${{ steps.bump.outputs.branch_name }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.BRANCH_NAME}`;
            const base = context.payload.repository.default_branch;
            const newVersion = process.env.NEW_VERSION;
            const oldVersion = process.env.OLD_VERSION;

            const title = `chore: bump version to ${newVersion}`;
            const body = `Bumps version from \`${oldVersion}\` to \`${newVersion}\`.`;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base
            });

            if (existing.data.length > 0) {
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body
            });
