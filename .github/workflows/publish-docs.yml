# This workflow builds and publishes the latest docs to
# the `gh-pages` branch.
# For more details: https://github.com/marketplace/actions/deploy-to-github-pages
name: Publish docs

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      with:
        # fetch all tags so `versioneer` can properly determine current version
        fetch-depth: 0
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # pin@v10.2.0
      with:
          python-version: '3.10'
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build
      run: uv run make sphinx
      shell: bash
    - name: Publish
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # pin@v4.9.0
      with:
        branch: gh-pages
        folder: docs/_build/html
