# This workflow publishes the package to pypi.
# For more details:
# https://docs.github.com/en/actions/guides/building-and-testing-python#publishing-to-package-registries
name: Publish

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      with:
        # fetch all tags so `versioneer` can properly determine current version
        fetch-depth: 0
    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # pin@v10.2.0
      with:
          python-version: '3.10'
    - name: Install dependencies
      run: uv sync --locked --all-extras --dev
    - name: Build and publish
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pin@v1.14.2
