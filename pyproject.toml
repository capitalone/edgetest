[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64.0.0",
]

[project]
name = "edgetest"
description = "Bleeding edge dependency testing"
license = { text = "Apache Software License" }
authors = [
    { name = "Akshay Gupta", email = "akshay.gupta2@capitalone.com" },
    { name = "Faisal Dosani", email = "faisal.dosani@capitalone.com" },
    { name = "Jacob Dawang", email = "jacob.dawang@capitalone.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "readme",
    "version",
]
dependencies = [
    "cerberus<=1.3.8,>=1.3.5",
    "click<=8.5.0,>=8.3.0",
    "packaging<=26.3,>20.6",
    "pluggy<=1.7.0,>=1.5.0",
    "pyproject-fmt<=2.30.2,>=2.0.0",
    "tabulate<=0.10.0,>=0.8.9",
    "tomlkit<=0.15.2,>=0.11.4",
    "uv<=0.13.6,>=0.13.4",
]
optional-dependencies.build = [ "build", "bumpver", "twine", "wheel" ]
optional-dependencies.dev = [
    "edgetest[build]",
    "edgetest[docs]",
    "edgetest[qa]",
    "edgetest[tests]",
]
optional-dependencies.docs = [
    "furo",
    "pillow",
    "recommonmark",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-tabs",
]
optional-dependencies.qa = [
    "mypy",
    "pre-commit",
    "pre-commit-uv",
    "ruff",
    "types-click",
    "types-setuptools",
    "types-tabulate",
]
optional-dependencies.tests = [ "coverage", "pytest", "pytest-cov" ]
urls."Bug Tracker" = "https://github.com/capitalone/edgetest/issues"
urls."Source Code" = "https://github.com/capitalone/edgetest"
urls.Documentation = "https://capitalone.github.io/edgetest/"
scripts.edgetest = "edgetest.interface:cli"

[tool.setuptools]
include-package-data = true
dynamic.readme = { file = [
    "README.md",
], content-type = "text/markdown" }
dynamic.version = { attr = "edgetest.__version__" }
zip-safe = false

[tool.ruff]
target-version = "py312"
extend-include = [
    "*.ipynb",
]
lint.select = [
    "B",                # flake8-bugbear
    "C",                # flake8-comprehensions
    "D",                # pydocstyle
    "E",                # pycodestyle errors
    "F",                # pyflakes
    "I",                # isort
    "LOG",              # flake8-logging
    "relative-imports", # flake8-tidy-imports ban relative imports
    "RUF",              # Ruff errors
    "SIM",              # flake8-simplify
    "T20",              # flake8-print
    "UP",               # pyupgrade
    "W",                # pycodestyle warnings
]
lint.ignore = [
    "complex-structure",                         # Add back in later
    "deprecated-import",                         # ``typing.x`` is deprecated, use ``x`` instead
    "docstring-tab-indentation",                 # Docstring indentation. Using formatter instead.
    "if-else-block-instead-of-if-exp",           # Use ternary operator instead of if-else blocks.
    "indentation-with-invalid-multiple",         # Check indentation level. Using formatter instead.
    "indentation-with-invalid-multiple-comment", # Check indentation level. Using formatter instead.
    "line-too-long",                             # Line too long. Using formatter instead.
    "non-empty-init-module",                     # non-empty-init-module
    "non-pep585-annotation",                     # ``typing.x`` is deprecated, use ``x`` instead
    "over-indented",                             # Check indentation level. Using formatter instead.
    "suppressible-exception",                    # Use ``contextlib.suppress(FileNotFoundError)`` insetad of try - execpt - pass.
    "triple-single-quotes",                      # Use triple single quotes. Using formatter instead.
    "whitespace-before-punctuation",             # Check whitespace. Using formatter instead.
]
lint.per-file-ignores."**/{tests,docs}/*" = [
    "ARG",
    "D",
    "module-import-not-at-top-of-file",
    "unused-variable",
]
lint.per-file-ignores."__init__.py" = [
    "module-import-not-at-top-of-file",
]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.pydocstyle.convention = "numpy"
lint.preview = true

[tool.pyproject-fmt]
column_width = 88
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"
warn_return_any = true
allow_redefinition = true
disable_error_code = "empty-body"
warn_unused_configs = true

[tool.pytest]
ini_options.addopts = "--verbose"
ini_options.markers = [
    "integration: mark test that interact with an external system",
    "unit: mark unit tests that do not require external interfaces and use mocking",
]

[tool.edgetest]
exclude_newer = "3 days"

[[tool.edgetest.env]]
name = "core"
extras = [
    "tests",
]
upgrade = [
    "Cerberus",
    "click",
    "pluggy",
    "tabulate",
    "packaging",
    "uv",
    "pyproject-fmt",
    "tomlkit",
]

[[tool.edgetest.env]]
name = "low"
extras = [
    "tests",
]
lower = [
    "Cerberus",
    "click",
    "pluggy",
    "tabulate",
    "packaging",
    "uv",
]

[bumpver]
current_version = "2026.10.3"
version_pattern = "YYYY.MM.INC0"

[bumpver.file_patterns]
"docs/source/conf.py" = [
    'version = "{version}"',
]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"edgetest/__init__.py" = [
    '__version__ = "{version}"',
]
